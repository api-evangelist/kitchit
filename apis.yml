name: Kitchit
description: 'Kitchit was a San Francisco on-demand private-chef marketplace founded
  in 2011 by Brendan Marshall and Ian Ferguson. The service matched consumers with
  vetted professional chefs who shopped, cooked, served, and cleaned up a multi-course
  meal in the customer''s own home, booked through the kitchit.com web and mobile
  storefront. In 2015 the company pivoted from fully customized menus to a lower-priced
  standardized product marketed as "Kitchit Tonight," priced around $39 per person
  with a two-person minimum. Kitchit served more than 100,000 meals across roughly
  five years of operation and reported a net promoter score of 87. It raised
  approximately $8.1M, with investors including Andreessen Horowitz, Crosslink Capital,
  Javelin Venture Partners, and Otter Rock Capital. The company announced its shutdown
  in April 2016, with the founders citing a finite investment runway that ended amid
  broad upheaval in food-tech, alongside contemporaneous failures at SpoonRocket,
  Dinner Lab, and Kitchensurfing. Kitchit is defunct: it operates no website, developer
  portal, or public API today, and no public API surface was ever published. This
  profile is retained as a historical/defunct provider record for network completeness.'
